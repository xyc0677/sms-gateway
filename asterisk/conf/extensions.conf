[general]
static = yes
writeprotect = yes

[globals]
MODEM = quectel0
; Rendered from the environment by entrypoint.sh (key for /internal/call-check).
CALLKEY = ${INTERNAL_KEY}

; ---- From the mobile network (China Unicom SIM, roaming) -------------------
[from-quectel]
; SMS arrive as the QuectelNewSMSBase64 AMI event, which the app consumes.
exten => sms,1,Hangup()
exten => ussd,1,Hangup()
; SMS send results also arrive over AMI (QuectelReport, Payload = our id).
exten => report,1,Hangup()
; chan_quectel starts incoming calls at the SIM's own number (when +CNUM
; knows it) or at "s", so catch every form and funnel to one place.
exten => s,1,Goto(inbound,1)
exten => _X.,1,Goto(inbound,1)
exten => _+X.,1,Goto(inbound,1)
exten => inbound,1,Set(CHANNEL(hangup_handler_push)=gsm-hangup,s,1(in))
 same => n,Gosub(callcheck,s,1(${CALLERID(num)}))
 same => n,GotoIf($["${GOSUB_RETVAL}" = "block"]?blocked)
 same => n,UserEvent(GsmIncoming,CallId: ${UNIQUEID},Number: ${CALLERID(num)})
; Ring the account on Flexisip (it owns the phone's binding and wakes it with
; a push); the masqueraded contact route loops back into Flexisip itself.
 same => n,Dial(PJSIP/iphone/sip:iphone@${SIP_DOMAIN},60)
 same => n,Hangup()
; Spam / blocklisted caller: reject without answering (a rejected roaming call
; costs nothing); the caller hears busy.
 same => n(blocked),UserEvent(GsmBlocked,CallId: ${UNIQUEID},Number: ${CALLERID(num)})
 same => n,Hangup(21)

; ---- Call screening -------------------------------------------------------
; Asks the app (blocklist / allowlist / hidden numbers). Fails open: if the app
; is slow or down, the call goes through.
[callcheck]
exten => s,1,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(VERDICT=${CURL(http://127.0.0.1:18300/internal/call-check?key=${CALLKEY}&num=${URIENCODE(${ARG1})})})
 same => n,Return(${IF($["${VERDICT}" = "block"]?block:allow)})

; Dry run without a real call: channel originate Local/<number>@callcheck-test application Wait 1
[callcheck-test]
exten => _X.,1,Gosub(callcheck,s,1(${EXTEN}))
 same => n,Log(NOTICE,callcheck-test ${EXTEN} -> ${GOSUB_RETVAL})
 same => n,Hangup()
exten => _+X.,1,Gosub(callcheck,s,1(${EXTEN}))
 same => n,Log(NOTICE,callcheck-test ${EXTEN} -> ${GOSUB_RETVAL})
 same => n,Hangup()

; ---- From the iPhone softphone: out through the modem ----------------------
; The SIM is roaming in Japan, so every number goes out in international form:
;   +XXXX       as dialled
;   00XXXX      -> +XXXX
;   0XXXX       -> +86 XXXX   (mainland landline with trunk 0)
;   anything    -> +86 ...    (mainland mobile, 10010, 95xxx ...)
; Japanese numbers therefore have to be dialled as +81... .
[from-iphone]
; Audio test (free, never touches the modem): dial *43 from Linphone or the
; web page and hear yourself.
exten => *43,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(/usr/share/asterisk/sounds/en/demo-echotest)  ; Alpine keeps sounds here, not in astdatadir
 same => n,Echo()
 same => n,Hangup()
exten => _+X.,1,Goto(outbound,${EXTEN},1)
exten => _00X.,1,Goto(outbound,+${EXTEN:2},1)
exten => _0X.,1,Goto(outbound,+86${EXTEN:1},1)
exten => _X.,1,Goto(outbound,+86${EXTEN},1)

; SIP is reachable from the internet (via Flexisip), so a leaked password must
; not turn into premium-rate international calls: only mainland China (+86)
; and Japan (+81) go out; everything else is refused before touching the modem.
[outbound]
exten => _+86X.,1,Goto(dial,${EXTEN},1)
exten => _+81X.,1,Goto(dial,${EXTEN},1)
exten => _+X.,1,Log(WARNING,Refused outbound call to ${EXTEN} (only +86/+81 allowed))
 same => n,Hangup(21)

[dial]
exten => _+X.,1,Set(CHANNEL(hangup_handler_push)=gsm-hangup,s,1(out))
 same => n,UserEvent(GsmOutgoing,CallId: ${UNIQUEID},Number: ${EXTEN})
 same => n,Dial(Quectel/${MODEM}/${EXTEN},120)
 same => n,Hangup()

; ---- Call record for the app ----------------------------------------------
[gsm-hangup]
exten => s,1,UserEvent(GsmCallEnd,CallId: ${UNIQUEID},Direction: ${ARG1},DialStatus: ${DIALSTATUS},Billsec: ${CDR(billsec)},Cause: ${HANGUPCAUSE})
 same => n,Return()
