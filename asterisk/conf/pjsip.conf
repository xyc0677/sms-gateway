; One SIP account for Linphone on the iPhone. Linphone never talks to Asterisk
; directly: it connects to Flexisip (sips:SIP_DOMAIN:5061, public), which
; forwards to this UDP 5060 over 127.0.0.1 and wakes the phone with push.
; UDP 5060 is LAN/Tailscale-only at the firewall; the ACL repeats that here.
[global]
type = global
user_agent = sms-gateway

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
local_net = 127.0.0.0/8
local_net = 192.168.0.0/16
local_net = 100.64.0.0/10

; type=acl applies to every SIP request this Asterisk receives.
[private-only]
type = acl
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.0/8
permit = 192.168.0.0/16
permit = 100.64.0.0/10

; The web page phone (WebRTC, JsSIP). Signalling arrives as SIP over WebSocket
; from Caddy on 127.0.0.1 (so the ACL above passes it); media is DTLS-SRTP with
; ICE on the same public RTP ports as Linphone. Same dialplan as the iPhone.
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

[web]
type = endpoint
transport = transport-ws
context = from-iphone
disallow = all
allow = opus,ulaw,alaw
auth = web
aors = web
webrtc = yes
dtls_auto_generate_cert = yes
direct_media = no
dtmf_mode = rfc4733
callerid = Web <web>

[web]
type = auth
auth_type = userpass
username = web
password = ${WEB_SIP_PASSWORD}

[web]
type = aor
max_contacts = 5
remove_existing = yes
qualify_frequency = 0

[iphone]
type = endpoint
context = from-iphone
disallow = all
allow = opus,g722,ulaw,alaw
auth = iphone
aors = iphone
direct_media = no
dtmf_mode = rfc4733
callerid = China Unicom <iphone>
; Flexisip owns the contact/route (CtRt) handling; do not rewrite it.
rewrite_contact = no
; Contacts come back from Flexisip as sip:...@127.0.0.1:5080;transport=tls (its
; internal UDP leg, but the phone's TLS transport param kept). Without a proxy
; Asterisk would try TLS, has no TLS transport, and Dial() fails as CONGESTION
; (caller hears "busy"). Always hand calls to Flexisip over UDP instead.
outbound_proxy = sip:127.0.0.1:5080\;lr
; Flexisip tells PBX-originated requests (route to the phone, push if asleep)
; from phone-originated ones (forward to us) by this From domain. PBX_TOKEN is
; secret: anyone who knows the domain could otherwise ring the phone directly.
from_domain = pbx-${PBX_TOKEN}.${SIP_DOMAIN}
rtp_symmetric = yes
force_rport = yes
; Media goes straight between the phone and Asterisk (public UDP 10000-10099).
; ICE lets the phone pick the LAN path at home (no NAT loopback on this router)
; and the STUN-learned public address outside; c= carries the LAN address.
ice_support = yes
media_address = ${LAN_IP}
; Audio crosses the internet: SRTP is mandatory (Linphone: media encryption SRTP).
media_encryption = sdes
media_encryption_optimistic = no

[iphone]
type = auth
auth_type = userpass
username = iphone
password = ${SIP_PASSWORD}

[iphone]
type = aor
; One phone: keep only its newest binding so calls never fork to dead connections.
max_contacts = 1
remove_existing = yes
remove_unavailable = no
; Flexisip adds Path, but stock Linphone does not advertise Supported: path,
; and Asterisk would answer the REGISTER with 420.
support_path = no
; The phone sleeps; Flexisip keeps the binding and pushes. No OPTIONS pings.
qualify_frequency = 0
default_expiration = 604800
maximum_expiration = 604800
