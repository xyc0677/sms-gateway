[general]
; UDP 10000-10099 is public (forwarded on the router, open on the host firewall):
; Linphone outside home sends media here. strictrtp drops anything that is
; not from the learned peer of an active call.
rtpstart = 10000
rtpend = 10099
strictrtp = yes
icesupport = yes
; Learns the current public address for ICE srflx candidates, so a new WAN IP
; from SoftBank needs no config change.
stunaddr = stun.l.google.com:19302
; docker bridges and link-local are never reachable from the phone
ice_blacklist = 172.16.0.0/12
ice_blacklist = 169.254.0.0/16
