[general]
interval = 15
smsdb = /data/smsdb
csmsttl = 600

[defaults]
context = from-quectel
group = 0
rxgain = 0
txgain = 0
autodeletesms = yes
resetquectel = yes
u2diag = -1
usecallingpres = yes
callingpres = allowed_passed_screen
disablesms = no
language = en
mindtmfgap = 45
mindtmfduration = 80
mindtmfinterval = 200
callwaiting = auto
initstate = start
dtmf = relax

; China Unicom SIM in the EC20F; audio over the module's USB audio card,
; which udev names "Quectel" (/etc/udev/rules.d/77-quectel-sms-gateway.rules).
[quectel0]
data = /dev/quectel-at
quec_uac = 1
alsadev = hw:CARD=Quectel,DEV=0
