   backdrops). Sits under the control's sheen and content. */
.lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-2;pointer-events:none;-webkit-mask-image:-webkit-radial-gradient(white,black)}

.lens-clone{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}

.lens{transition:opacity .3s}.mini>.lens{opacity:0}  /* shrunk bar: the scale transform garbles filters, use plain glass */
@media (prefers-color-scheme:dark){.has-lens{--g-fill:rgba(255,255,255,.04)}}

.composer{display:flex;align-items:flex-end;gap:6px;box-sizing:border-box;width:100%;border-radius:24px;padding:4px}
.composer ion-textarea{flex:1;min-width:0;font-size:16px;min-height:40px;--background:transparent;--color:var(--g-ink);

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 4px 4px}
.act{appearance:none;border:0;font:inherit;border-radius:18px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ion-color-primary);font-size:12px;font-weight:600;transition:scale .45s var(--spring);-webkit-tap-highlight-color:transparent}
.act ion-icon{font-size:24px}.act:active{scale:1.08}.act:disabled{opacity:.35}
.act.danger{color:var(--ion-color-danger)}
/* dial pad */
.dialer{display:flex;flex-direction:column;align-items:center;padding:8px 0 20px}
.dial-num{font-size:36px;font-weight:300;letter-spacing:1px;min-height:48px;text-align:center;padding:0 20px;word-break:break-all;font-variant-numeric:tabular-nums}
.dial-info{font-size:13px;color:var(--ion-color-medium);min-height:20px;margin-bottom:14px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.key{appearance:none;border:0;font:inherit;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ion-text-color);transition:scale .4s var(--spring),filter .2s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.key b{font-size:32px;font-weight:400;line-height:1}.key small{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--ion-color-medium);min-height:12px}
.key:active{scale:1.1;filter:brightness(1.15)}
.dial-row{display:grid;grid-template-columns:repeat(3,76px);gap:26px;margin-top:18px;align-items:center;justify-items:center}
.callbtn{appearance:none;border:0;width:76px;height:76px;border-radius:50%;background:#34c759;color:#fff;font-size:34px;display:grid;place-items:center;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 8px 22px rgba(52,199,89,.4);transition:scale .4s var(--spring)}
.callbtn:active{scale:1.1}.callbtn:disabled{opacity:.4}
.key-del{appearance:none;border:0;background:none;color:var(--ion-color-medium);font-size:30px;width:60px;height:60px}
.login-hero ion-icon{font-size:64px}
.login-hero h2{margin:8px 0 0}

function dial(start = "") {
  setTitle("拨号");
  const KEYS = [["1", ""], ["2", "ABC"], ["3", "DEF"], ["4", "GHI"], ["5", "JKL"], ["6", "MNO"], ["7", "PQRS"], ["8", "TUV"], ["9", "WXYZ"], ["*", ""], ["0", "+"], ["+", ""]];
  $("#main").innerHTML = `<div class="dialer"><div class="dial-num" id="dn"></div><div class="dial-info" id="di"></div>
    <div class="keys">${KEYS.map(([k, s]) => k ? `<button class="key glass" data-k="${k}"><b>${k}</b><small>${s}</small></button>` : "<span></span>").join("")}</div>
    <div class="dial-row"><span></span><button class="callbtn" id="dc" aria-label="拨打"><ion-icon name="call"></ion-icon></button>
      <button class="key-del" id="dd" aria-label="删除"><ion-icon name="backspace-outline"></ion-icon></button></div></div>`;
  let num = start, seq = 0, t;
  const show = () => {
    $("#dn").textContent = num; $("#dc").disabled = num.replace(/[^0-9*]/g, "").length < 3;
    clearTimeout(t); const my = ++seq;
    if (num.replace(/\D/g, "").length < 3) { $("#di").textContent = ""; return; }
    if (/[*#]/.test(num)) { $("#di").textContent = num === "*43" ? "回声测试（免费，听到自己的声音说明通话音频正常）" : ""; return; }
    t = setTimeout(async () => { try { const d = await api("/api/number?n=" + encodeURIComponent(num)); if (my !== seq) return;
      const i = d.info; $("#di").textContent = [i.name, i.loc, i.carrier, i.category, i.tag].filter(Boolean).join(" · "); } catch {} }, 250);
  };
  $("#main").querySelectorAll(".key").forEach(b => b.onclick = () => { if (num.length < 20) num += b.dataset.k; show(); });
  $("#dd").onclick = () => { num = num.slice(0, -1); show(); };
  $("#dc").onclick = () => callNumber(num);
  show();
}

    return `<ion-list-header><ion-label>${title}</ion-label><ion-note style="margin-right:20px">${ls.length} 个</ion-note></ion-list-header>
    <ion-list inset>${ls.map((line, i) => { const r = s.rule_info[line] || {kind: "number", display: line, sub: ""};
      return `<ion-item ${r.kind === "number" ? `button detail="false" data-num="${esc(line.split("#")[0].trim())}"` : ""}>
        <ion-icon slot="start" name="${r.kind === "prefix" ? "git-branch-outline" : r.kind === "kw" ? "text-outline" : allow ? "checkmark-circle" : "ban"}" color="${allow ? "success" : "danger"}"></ion-icon>
        <ion-label>${esc(r.display)}<p>${esc([r.sub, r.note].filter(Boolean).join(" · "))}</p></ion-label>
        <ion-button slot="end" fill="clear" color="medium" data-rk="${key}" data-ri="${i}" aria-label="移除"><ion-icon slot="icon-only" name="trash-outline"></ion-icon></ion-button></ion-item>`; }).join("")}
      <ion-item button detail="false" data-radd="${key}"><ion-icon slot="start" name="add-circle" color="primary"></ion-icon><ion-label color="primary">添加号码</ion-label></ion-item></ion-list>
    <p class="hint">${hint}</p>`; };
  $("#main").innerHTML = `
  <ion-list-header><ion-label>Bark 推送设备</ion-label></ion-list-header>
  <ion-list inset>
    ${s.bark_list.map((d, i) => `<ion-item button detail="false" data-dev="${i}"><ion-icon slot="start" name="${devIcon(d.name)}" color="primary"></ion-icon>
      <ion-label>${esc(d.name || "未命名设备")}<p>${d.local ? "本机 Bark 服务器" : esc(d.host)} · 密钥 ${esc(d.key)}</p></ion-label>
      <ion-icon slot="end" name="ellipsis-horizontal" color="medium"></ion-icon></ion-item>`).join("")}
    <ion-item button detail="false" id="devadd"><ion-icon slot="start" name="add-circle" color="primary"></ion-icon><ion-label color="primary">添加设备</ion-label></ion-item>
  </ion-list>
  <p class="hint">短信、拦截记录、告警会同时推给这里的每一台设备。点设备可以单独发测试、改名或删除。</p>
  <div class="btnrow"><ion-button fill="outline" id="test"><ion-icon slot="start" name="paper-plane-outline"></ion-icon>给所有设备发测试推送</ion-button></div>

  <ion-list-header><ion-label>提醒</ion-label></ion-list-header>
  <ion-list inset>
    ${toggleItem("al", "故障告警", "模块掉网、VoLTE 不可用、服务挂了、备份失败时发一条带声音的提醒，恢复了再告诉你", s.alerts)}
    ${toggleItem("ds", "每日小结", "每天早上 9 点推一条：过去一天收了多少短信和电话、网关是否正常", s.daily_summary)}
  </ion-list>

  <ion-list-header><ion-label>来电拦截</ion-label></ion-list-header>
  <ion-list inset>
    <ion-item><ion-icon slot="start" name="shield-half-outline" color="primary"></ion-icon>
      <ion-select id="cm" label="拦截方式" interface="action-sheet" cancel-text="取消" value="${s.call_mode}">
      <ion-select-option value="smart">智能拦截</ion-select-option><ion-select-option value="all">全部拦截</ion-select-option>
      <ion-select-option value="list">只拦黑名单</ion-select-option></ion-select></ion-item>
    ${toggleItem("ba", "拒接隐藏号码", "没有来电号码的电话直接拒接", s.block_anonymous)}
    ${toggleItem("om", "联网查询号码标记", "陌生号码来电、来短信时去百度搜一次它的标记。关掉后号码不会发给任何人，智能拦截只用已经查过的结果", s.online_marks)}
  </ion-list>
  <p class="hint" id="cmhint">${CM_HINT[s.call_mode]}</p>

  <ion-list-header><ion-label>短信拦截</ion-label></ion-list-header>
  <ion-list inset>
    ${toggleItem("bm", "自动拦截营销短信", "带“退订/拒收回复R”的推销内容；验证码、银行、运营商、快递通知不拦", s.block_marketing)}
    <ion-item lines="full"><div class="kwchips">${kws.length ? kws.map((k, i) => `<ion-chip data-kw="${i}" outline><ion-label>${esc(k)}</ion-label><ion-icon name="close-circle"></ion-icon></ion-chip>`).join("")
      : '<ion-note>还没有屏蔽关键词</ion-note>'}</div></ion-item>
    <ion-item><ion-input id="kwin" aria-label="新关键词" placeholder="添加屏蔽关键词" enterkeyhint="done"></ion-input>
      <ion-button slot="end" fill="clear" id="kwadd">添加</ion-button></ion-item>
  </ion-list>
  <p class="hint">短信里出现这些词就拦截，只发一条静默通知。<b>验证码短信也会被拦</b>，别加太宽泛的词。点关键词就能删掉，一次可以用空格隔开添加多个。</p>

  ${ruleList("block_rules", "黑名单", "黑名单里的号码：短信拦截，来电拒接。")}
  ${ruleList("allow_rules", "白名单", "白名单里的号码永远放行：短信不拦，电话照常响铃（“全部拦截”模式下也会响）。")}

  <ion-list-header><ion-label>高级</ion-label></ion-list-header>
  <ion-list inset>
    <ion-item><ion-input id="ek" label="推送加密密钥（可不填）" label-placement="stacked" value="${esc(s.bark_enc_key)}" placeholder="AES-256，32 位"></ion-input>
      <ion-button slot="end" fill="clear" id="gen">生成</ion-button></ion-item>
    <ion-item><ion-input id="pub" label="本页面的公网地址" label-placement="stacked" value="${esc(s.public_base_url)}" placeholder="https://sms.example.com"></ion-input></ion-item>
  </ion-list>
  <p class="hint">填了加密密钥的话，每台设备都要在 Bark App「推送加密」里选 AES256 / CBC 并填同一个密钥。</p>
  <div class="btnrow"><ion-button id="save"><ion-icon slot="start" name="checkmark"></ion-icon>保存</ion-button></div>

  <ion-list-header><ion-label>Linphone 来电推送</ion-label></ion-list-header>
  <ion-list inset>
    <ion-item><ion-input id="lu" label="linphone.org 用户名" label-placement="stacked" value="${esc(s.linphone_user)}" autocomplete="off" autocapitalize="none"></ion-input></ion-item>
    <ion-item><ion-input id="lp" type="password" label="密码" label-placement="stacked" placeholder="${s.linphone_password_set ? "已设置，留空不改" : "未设置"}" autocomplete="off"></ion-input></ion-item>
    <ion-item><ion-icon slot="start" name="${s.linphone_key_ok ? "checkmark-circle" : "alert-circle"}" color="${s.linphone_key_ok ? "success" : "warning"}"></ion-icon>
      <ion-label>${s.linphone_key_ok ? "推送密钥正常" : "推送密钥未生成"}</ion-label></ion-item>
  </ion-list>
  <p class="hint">锁屏来电靠 linphone.org 的推送服务。填用户名（不是邮箱）和密码，NAS 会自动申请并续期推送密钥。</p>
  <div class="btnrow"><ion-button id="lsave"><ion-icon slot="start" name="key-outline"></ion-icon>保存并测试</ion-button></div>

  <ion-list-header><ion-label>iPhone SIP 账号</ion-label></ion-list-header>
  <ion-list inset>
    <ion-item><ion-icon slot="start" name="person-circle-outline" color="primary"></ion-icon><ion-label>用户名</ion-label><ion-note slot="end">${esc(s.sip_username)}</ion-note></ion-item>
    <ion-item><ion-icon slot="start" name="key-outline" color="primary"></ion-icon><ion-input type="password" label="密码" readonly value="${esc(s.sip_password)}"><ion-input-password-toggle slot="end"></ion-input-password-toggle></ion-input></ion-item>
  </ion-list>

  <ion-list-header><ion-label>通行密钥</ion-label></ion-list-header>
  <ion-list inset id="pklist">
    ${pks.map(k => `<ion-item><ion-icon slot="start" name="finger-print" color="primary"></ion-icon>
      <ion-label>${esc(k.name)}<p>添加于 ${fmt(k.created)}${k.last_used ? " · 上次使用 " + fmt(k.last_used) : ""}</p></ion-label>
      <ion-button slot="end" fill="clear" color="danger" data-pk="${esc(k.id)}" aria-label="删除"><ion-icon slot="icon-only" name="trash-outline"></ion-icon></ion-button></ion-item>`).join("")}
    ${passkeyUsable() ? `<ion-item button detail="false" id="pkadd"><ion-icon slot="start" name="add-circle" color="primary"></ion-icon><ion-label color="primary">添加通行密钥</ion-label></ion-item>`
      : `<ion-item><ion-label class="ion-text-wrap"><p>通行密钥只能在 https://${esc(appState.passkey_rp)} 上添加和使用。</p></ion-label></ion-item>`}
  </ion-list>
  <p class="hint">添加后，登录页点“使用通行密钥登录”，用面容 ID 就能进来，不用输密码。通行密钥存在你的 iCloud 钥匙串里，同一个 Apple 账号的 iPhone、iPad、Mac 都能用。</p>

  <ion-list-header><ion-label>安全</ion-label></ion-list-header>
  <ion-list inset>
    <ion-item button detail="false" id="chg"><ion-icon slot="start" name="lock-closed-outline" color="primary"></ion-icon><ion-label>修改登录密码</ion-label></ion-item>
    <ion-item button detail="false" id="all"><ion-icon slot="start" name="phone-portrait-outline" color="warning"></ion-icon><ion-label>退出所有设备</ion-label></ion-item>
    <ion-item button detail="false" id="out"><ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon><ion-label color="danger">退出登录</ion-label></ion-item>
  </ion-list>`;
  $("#gen").onclick = () => { const a = new Uint8Array(24); crypto.getRandomValues(a); $("#ek").value = btoa(String.fromCharCode(...a)).replace(/[+/=]/g, "x").slice(0, 32); };
  const saveSet = async (body, msg = "已保存") => {
    try { await api("/api/settings", {method: "POST", body: JSON.stringify(body)}); if (msg) toast(msg, "success"); return true; }
    catch (e) { toast(e.message, "danger"); return false; } };
  $("#save").onclick = () => saveSet({bark_enc_key: $("#ek").value || "", public_base_url: $("#pub").value || ""});
  $("#test").onclick = async () => { try { await api("/api/test-push", {method: "POST"}); toast("已发出，看看各台设备", "success"); } catch (e) { toast(e.message, "danger"); } };
  // Bark devices
  $("#main").querySelectorAll("[data-dev]").forEach(el => el.onclick = async () => {
    const i = +el.dataset.dev, d = s.bark_list[i];
    const act = await sheet(d.name || "未命名设备", [{text: "发测试推送", icon: "paper-plane-outline", data: "test"},
      {text: "改名", icon: "create-outline", data: "rename"}, {text: "删除这台设备", icon: "trash-outline", role: "destructive", data: "del"}]);
    if (act === "test") {
      try { await api("/api/test-push", {method: "POST", body: JSON.stringify({index: i})}); toast(`已发给 ${d.name || "这台设备"}`, "success"); }
      catch (e) { toast(e.message, "danger"); }
    } else if (act === "rename") {
      const v = await prompt2("改名", "", [{name: "name", value: d.name, placeholder: "如 iPad"}], "保存");
      if (!v) return;
      const ls = [...devLines]; ls[i] = `${v.name.trim()} ${ls[i].split(/\s+/).pop()}`.trim();
      if (await saveSet({bark_devices: ls.join("\n")}, "已改名")) settings();
    } else if (act === "del") {
      if (!await ask(`删除 ${d.name || "这台设备"}？`, "删除后这台设备不再收到推送。", "删除")) return;
      if (await saveSet({bark_devices: devLines.filter((_, j) => j !== i).join("\n")}, "已删除")) settings();
    }
  });
  $("#devadd").onclick = async () => {
    const v = await prompt2("添加推送设备", `在这台设备的 Bark App 里添加服务器 https://${location.host}/bark，然后把它的测试链接复制到下面。`,
      [{name: "name", placeholder: "备注，如 iPad"}, {name: "url", placeholder: "粘贴测试链接"}], "添加");
    if (!v || !v.url.trim()) return;
    if (await saveSet({bark_devices: [...devLines, `${v.name.trim()} ${v.url.trim()}`.trim()].join("\n")}, "已添加")) settings();
  };
  // switches save as soon as they change
  $("#cm").addEventListener("ionChange", e => { $("#cmhint").textContent = CM_HINT[e.detail.value]; saveSet({call_mode: e.detail.value}); });
  for (const [id, key] of [["ba", "block_anonymous"], ["bm", "block_marketing"], ["al", "alerts"], ["ds", "daily_summary"], ["om", "online_marks"]])
    $("#" + id).addEventListener("ionChange", e => saveSet({[key]: e.detail.checked}));
  // keywords
  $("#main").querySelectorAll("[data-kw]").forEach(c => c.onclick = async () => {
    const i = +c.dataset.kw;
    if (await saveSet({block_keywords: kws.filter((_, j) => j !== i).join("\n")}, `已删除「${kws[i]}」`)) settings(); });
  const addKw = async () => {
    const add = ($("#kwin").value || "").split(/[\s,，、]+/).filter(k => k && !kws.includes(k));
    if (!add.length) return;
    if (await saveSet({block_keywords: [...kws, ...add].join("\n")}, `已添加「${add.join("」「")}」`)) settings(); };
  $("#kwadd").onclick = addKw;
  $("#kwin").addEventListener("keydown", e => { if (e.key === "Enter") addKw(); });
  // block / allow lists
  $("#main").querySelectorAll("[data-num]").forEach(el => el.onclick = () => route("contact", el.dataset.num));
  $("#main").querySelectorAll("[data-rk]").forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    const key = b.dataset.rk, i = +b.dataset.ri, ls = ruleLines(key), r = s.rule_info[ls[i]] || {display: ls[i]};
    if (!await ask(`从${key === "allow_rules" ? "白" : "黑"}名单移除？`, r.display, "移除")) return;
    if (await saveSet({[key]: ls.filter((_, j) => j !== i).join("\n")}, "已移除")) settings(); });
  $("#main").querySelectorAll("[data-radd]").forEach(el => el.onclick = async () => {
    const key = el.dataset.radd, ls = ruleLines(key);
    const v = await prompt2(key === "allow_rules" ? "添加到白名单" : "添加到黑名单", "填完整号码；要拦一整个号段就在前缀后面加 *，比如 170*",
      [{name: "n", type: "tel", placeholder: "号码，或前缀*"}], "添加");
    const n = (v?.n || "").replace(/[\s()-]/g, "");
    if (!n) return;
    if (!/^\+?\d{3,}\*?$/.test(n)) return toast("号码格式不对", "danger");
    if (ls.some(l => l.split("#")[0].trim() === n)) return toast("已经在名单里了");
    if (await saveSet({[key]: [...ls, n].join("\n")}, "已添加")) settings(); });
  $("#lsave").onclick = async () => { const b = {linphone_user: $("#lu").value || ""}; if ($("#lp").value) b.linphone_password = $("#lp").value;
    try { await api("/api/settings", {method: "POST", body: JSON.stringify(b)}); await api("/api/test-linphone", {method: "POST"}); toast("账号可用，推送密钥已生成", "success"); settings(); }
    catch (e) { toast(e.message, "danger"); } };
  $("#chg").onclick = async () => {
    const v = await prompt2("修改登录密码", "新密码至少 10 位。", [{name: "cur", type: "password", placeholder: "当前密码"},
      {name: "n1", type: "password", placeholder: "新密码"}, {name: "n2", type: "password", placeholder: "再输一次新密码"}], "修改");
    if (!v) return;
    if (v.n1 !== v.n2) return toast("两次输入的新密码不一致", "danger");
    try { await api("/api/settings", {method: "POST", body: JSON.stringify({current_password: v.cur, new_password: v.n1})}); toast("登录密码已修改", "success"); }
    catch (e) { toast(e.message, "danger"); } };
  if ($("#pkadd")) $("#pkadd").onclick = addPasskey;
  $("#main").querySelectorAll("ion-button[data-pk]").forEach(b => b.onclick = async () => {
    if (!await ask("删除这个通行密钥？", "删除后它就不能再登录了（设备上的钥匙串条目可以在 iPhone“密码”App 里删）。", "删除")) return;
    try { await api("/api/passkey/delete", {method: "POST", body: JSON.stringify({id: b.dataset.pk})}); settings(); } catch (e) { toast(e.message, "danger"); } });
  $("#all").onclick = async () => { if (!await ask("退出所有设备？", "所有已登录的手机和电脑都需要重新登录。", "全部退出")) return; await api("/api/logout-all", {method: "POST"}); route("login"); };
  $("#out").onclick = async () => { await api("/api/logout", {method: "POST"}); route("login"); };
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
  document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); return Promise.resolve();
}
async function start() {
  await customElements.whenDefined("ion-app");
  const s = appState = await (await fetch("/api/state")).json();
  if (s.setup_needed) return route("setup", s.setup_allowed);
  if (!s.logged_in) return route("login");
  const m = location.hash.match(/^#n=(.+)$/);
  if (location.hash === "#v=spam") { location.hash = ""; return route("spam"); }
  m ? route("thread", decodeURIComponent(m[1])) : route("threads");
}
start();
</script>
</body>
</html>
